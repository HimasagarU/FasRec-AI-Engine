name: Keep FasRec Server Alive

on:
  schedule:
    # Run every 5 minutes to ensure the Render free tier service doesn't spin down.
    # Note: GitHub Actions schedule can be delayed, so 5m is safer than 13m.
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$URL" ]; then
            echo "Error: RENDER_APP_URL secret is not set."
            exit 1
          fi
          
          # Remove trailing slash if present to avoid double slashes
          URL="${URL%/}"
          
          echo "Pinging $URL/keep-alive..."
          curl -s -L -f "$URL/keep-alive" || { echo "Ping failed! Check if the URL is correct and the server is up."; exit 1; }
          echo "Successfully pinged the FasRec server."
